# wpa_supplicant configuration for wlan0.
#
# Placeholders only. No real credentials ship in this image. Set your own
# network name (ssid) and password (psk), then on the printer run:
#   systemctl restart wpa_supplicant@wlan0
# or template this file at first boot from your provisioning system.
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=US

network={
	ssid="YOUR_WIFI_SSID"
	psk="YOUR_WIFI_PASSWORD"
	key_mgmt=WPA-PSK
	scan_ssid=1
	priority=40
}
