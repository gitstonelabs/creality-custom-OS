# dhcpcd config — DHCP client only, default-route via wlan0 when WiFi up,
# via usb0 as fallback. Tight timeouts so first-boot doesn't hang for ages
# if the AIC8800 driver fails to associate.

hostname
clientid
persistent
option rapid_commit
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
slaac private

# Prefer WiFi over USB-Ethernet-gadget for the default route
interface wlan0
	metric 100

interface usb0
	metric 200
	# usb0 is a static link (printer-side static IP) — don't try DHCP on it
	static ip_address=10.55.0.1/24
	noarp

# 30s timeout per interface (default is 30, but let's be explicit)
timeout 30
