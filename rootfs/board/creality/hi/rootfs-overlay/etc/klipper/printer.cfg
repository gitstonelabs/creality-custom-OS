# printer.cfg — STARTER Klipper config for Creality Hi with gitStoneLabs custom kernel
#
# This is intentionally minimal. It does NOT activate any motion (no [stepper_*]
# config) because:
#   1. The Y-axis is currently broken (mainboard Y driver short — will be fixed
#      when you replace the mainboard)
#   2. We want Klipper to come up clean in Fluidd so you can verify the host
#      stack is working before touching motors
#
# To turn this into a printing config, follow the comments below + the
# Creality Hi sample config from upstream Klipper:
#   /opt/klipper/config/printer-creality-hi-*.cfg  (if any)

[mcu]
# Placeholder — will need a real MCU (USB-serial Klipper firmware) before
# Klipper will actually start. Leaving this commented out for first-boot:
# serial: /dev/serial/by-id/usb-Klipper_...
# (See `ls /dev/serial/by-id/` after plugging a Klipper-flashed MCU in)

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# -----------------------------------------------------------------------------
# CFS module — pulled in once you wire the CFS-C box to a USB-RS485 adapter
# or to UART5 on the bed MCU. Commented for first-boot.
# -----------------------------------------------------------------------------
# [creality_cfs]
# serial_port: /dev/ttyUSB0
# baud: 230400
# box_count: 1

# [include /etc/klipper/macros/cfs_macros.cfg]

# -----------------------------------------------------------------------------
# Once you have an MCU connected, uncomment the [mcu] section above and add
# stepper/extruder/heater config from upstream Creality Hi reference.
# -----------------------------------------------------------------------------
